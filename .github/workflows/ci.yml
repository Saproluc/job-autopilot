name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Lint with flake8
        run: |
          pip install flake8
                  flake8 src/ --max-line-length=120 --ignore=E501,W503,W291,W293,F401,E402,E127,E261,F841,F541
          
      - name: Check imports
        run: python -c "from src.tracker import ApplicationTracker; print('✅ Imports OK')"
